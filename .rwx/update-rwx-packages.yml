# Propose same-major RWX package updates for every definition in .rwx/.
# A newer compatible release opens (or updates) one "Update RWX packages" PR on
# an rwx-update-* branch. It does not auto-merge: main has no required checks
# or approval bot here, so a person reviews and merges it after .rwx/ci.yml
# passes. No update means no PR.
#
# Credentials: amfaro-rwx-workflows-management (RWX vault) clones main, pushes
# the rwx-update-* branch and opens the PR. It is used only by this
# default-branch cron/dispatch workflow, never by .rwx/ci.yml candidate runs.
#
# Recovery: close the PR and delete its rwx-update-* branch to discard a bad
# proposal; the next run re-opens it from main. Run on demand with
# `rwx dispatch jarify-jetbrains-update-rwx-packages`.
on:
  cron:
    - key: update-rwx-packages-weekly
      # Monday 10:00 UTC
      schedule: '0 10 * * 1'

  dispatch:
    key: jarify-jetbrains-update-rwx-packages

  cli: {}

concurrency-pools:
  - id: amfaro/jarify-jetbrains:update-rwx-packages
    capacity: 1
    on-overflow: queue

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: update-rwx-packages
    call: rwx/update-packages-github 2.2.0
    with:
      repository: https://github.com/amfaro/jarify-jetbrains.git
      # Always the trusted default branch, whatever ref started the run.
      ref: main
      github-token: ${{ vaults.rwx-github-workflows.github-apps.amfaro-rwx-workflows-management.token }}
      allow-major-version-change: false
      enable-auto-merge: false
